name: Build ElectroScan Pro APK (Offline PaddleOCR + Native TTS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies & prepare OCR assets
        run: |
          npm install
          npm run prepare:ocr

      - name: Add Android platform if missing, sync Capacitor & apply patches
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          npm run patch:android

      - name: Build Android APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electro_Scan_Pro_v13_PaddleOCR_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
