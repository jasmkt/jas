name: Build Electro_Scan_Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch AndroidManifest.xml (Camera, Mic, Gallery, Internet)
        run: node scripts/patch-android.js

      - name: Generate App Icon
        run: |
          if [ -f "assets/icon-only.png" ]; then
            npx -y @capacitor/assets generate --android --iconBackgroundColor '#020617' --splashBackgroundColor '#020617'
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK output
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Electro_Scan_Pro_v12_2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electro_Scan_Pro_v12_2_APK
          path: release/Electro_Scan_Pro_v12_2.apk
          retention-days: 30
