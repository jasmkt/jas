name: Build ElectroScan Pro APK (Offline PaddleOCR)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies (Capacitor + ONNX Runtime Web)
        run: npm install

      - name: Prepare Local ONNX Runtime Web Assets (./www/ocr/)
        run: npm run prepare:ocr

      - name: Download Offline PaddleOCR v4 Model & Dictionary into ./www/ocr/
        run: |
          mkdir -p www/ocr
          echo "Downloading en_PP-OCRv4_rec_infer.onnx..."
          curl -fSL --retry 3 \
            "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/en_PP-OCRv4_rec_infer.onnx" \
            -o www/ocr/en_PP-OCRv4_rec_infer.onnx || \
          curl -fSL --retry 3 \
            "https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/english/rec.onnx" \
            -o www/ocr/en_PP-OCRv4_rec_infer.onnx

          echo "Downloading en_dict.txt..."
          curl -fSL --retry 3 \
            "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/en_dict.txt" \
            -o www/ocr/en_dict.txt || \
          curl -fSL --retry 3 \
            "https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/english/dict.txt" \
            -o www/ocr/en_dict.txt

          ls -lh www/ocr/
          test -s www/ocr/en_PP-OCRv4_rec_infer.onnx
          test -s www/ocr/en_dict.txt

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Patch Android Manifest & MainActivity
        run: node patch-android.js

      - name: Sync Web Assets + PaddleOCR Models to Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Electro_Scan_Pro_v13_PaddleOCR.apk
          ls -lh Electro_Scan_Pro_v13_PaddleOCR.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electro_Scan_Pro_v13_PaddleOCR_APK
          path: Electro_Scan_Pro_v13_PaddleOCR.apk
          retention-days: 30
